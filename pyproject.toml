[project]
name = "Open_Duck_Playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "framesviewer>=1.0.2",
    "jax[cuda12]>=0.4.35",
    "jax2onnx>=0.1.0",
    "jaxlib>=0.4.35",
    "jaxtyping>=0.2.38",
    "matplotlib>=3.10.0",
    "mediapy>=1.2.2",
    "onnxruntime-gpu>=1.20.1",
    "playground>=0.0.3",
    "pygame>=2.6.1",
    "tensorflow>=2.18.0",
    "tf2onnx>=1.16.1",
    "torch>=2.10.0.dev",
    "torchvision>=0.21.0.dev",
    "torchaudio>=2.10.0.dev",
    "warp-lang",
]
[build-system]
requires = ["setuptools"]
[tool.setuptools]
packages = ["playground"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true